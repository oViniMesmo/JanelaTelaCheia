<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Deep Indigo to Navy to Vibrant Cyan -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="35%" stop-color="#1e1b4b" />
      <stop offset="70%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="45%" stop-color="#818cf8" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.95" />
    </linearGradient>

    <!-- Expansion Arrows / Brackets Gradient -->
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#67e8f9" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <!-- Center Player Background Gradient -->
    <linearGradient id="playerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>

    <!-- Center Player Border Gradient -->
    <linearGradient id="playerBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Drop Shadow for Player & Elements -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Base Window Body (Rounded Squircle) -->
  <rect x="6" y="6" width="116" height="116" rx="24" fill="url(#bgGrad)" />
  <rect x="6" y="6" width="116" height="116" rx="24" fill="none" stroke="url(#borderGrad)" stroke-width="2.5" />

  <!-- Window Title Bar Glass Accent -->
  <path d="M 6 30 C 6 16.745 16.745 6 30 6 L 98 6 C 111.255 6 122 16.745 122 30 L 122 32 L 6 32 Z" fill="#ffffff" fill-opacity="0.04" />
  <line x1="6" y1="32" x2="122" y2="32" stroke="#38bdf8" stroke-opacity="0.25" stroke-width="1.5" />

  <!-- Window Control Traffic Lights -->
  <circle cx="22" cy="19" r="3.5" fill="#f87171" />
  <circle cx="32" cy="19" r="3.5" fill="#fbbf24" />
  <circle cx="42" cy="19" r="3.5" fill="#34d399" />

  <!-- Window Header Title Bar Subtle Pill/Tabs Indicator -->
  <rect x="56" y="15" width="28" height="8" rx="4" fill="#ffffff" fill-opacity="0.08" />

  <!-- 4 Corner Expansion Brackets & Directional Arrows -->
  <!-- Top-Left Corner ↖ -->
  <g stroke="url(#arrowGrad)" stroke-linecap="round" stroke-linejoin="round" filter="url(#subtleShadow)">
    <path d="M 38 46 L 24 46 L 24 60" fill="none" stroke-width="4" />
    <line x1="25" y1="47" x2="39" y2="61" stroke-width="3.5" />
  </g>

  <!-- Top-Right Corner ↗ -->
  <g stroke="url(#arrowGrad)" stroke-linecap="round" stroke-linejoin="round" filter="url(#subtleShadow)">
    <path d="M 90 46 L 104 46 L 104 60" fill="none" stroke-width="4" />
    <line x1="103" y1="47" x2="89" y2="61" stroke-width="3.5" />
  </g>

  <!-- Bottom-Left Corner ↙ -->
  <g stroke="url(#arrowGrad)" stroke-linecap="round" stroke-linejoin="round" filter="url(#subtleShadow)">
    <path d="M 24 92 L 24 106 L 38 106" fill="none" stroke-width="4" />
    <line x1="25" y1="105" x2="39" y2="91" stroke-width="3.5" />
  </g>

  <!-- Bottom-Right Corner ↘ -->
  <g stroke="url(#arrowGrad)" stroke-linecap="round" stroke-linejoin="round" filter="url(#subtleShadow)">
    <path d="M 104 92 L 104 106 L 90 106" fill="none" stroke-width="4" />
    <line x1="103" y1="105" x2="89" y2="91" stroke-width="3.5" />
  </g>

  <!-- Central Video Player Display -->
  <g filter="url(#subtleShadow)">
    <rect x="45" y="62" width="38" height="28" rx="7" fill="url(#playerBg)" stroke="url(#playerBorder)" stroke-width="2" />
    <!-- Play Triangle -->
    <path d="M 59 70 L 73 76 L 59 82 Z" fill="#ffffff" />
  </g>
</svg>
